<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Gas cylinder delivery van illustration">
  <title>GasVan Sale Testing</title>
  <rect width="800" height="450" fill="#f7efec"/>
  <circle cx="140" cy="100" r="130" fill="#c0392b" opacity="0.08"/>
  <circle cx="680" cy="370" r="150" fill="#c0392b" opacity="0.08"/>

  <line x1="40" y1="360" x2="760" y2="360" stroke="#e6d8d4" stroke-width="3"/>

  <!-- Motion lines -->
  <g stroke="#c0392b" stroke-width="5" stroke-linecap="round" opacity="0.3">
    <line x1="90" y1="230" x2="150" y2="230"/>
    <line x1="78" y1="260" x2="158" y2="260"/>
    <line x1="98" y1="292" x2="170" y2="292"/>
  </g>

  <!-- Gas cylinders -->
  <g>
    <rect x="120" y="230" width="46" height="100" rx="14" fill="#c0392b"/>
    <rect x="132" y="212" width="22" height="20" rx="4" fill="#c0392b"/>
    <rect x="120" y="270" width="46" height="10" fill="#ffffff" opacity="0.45"/>

    <rect x="176" y="250" width="42" height="80" rx="13" fill="#c0392b" opacity="0.85"/>
    <rect x="187" y="234" width="20" height="18" rx="4" fill="#c0392b" opacity="0.85"/>
    <rect x="176" y="284" width="42" height="9" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Van -->
  <g>
    <rect x="230" y="220" width="300" height="110" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="4"/>
    <path d="M530 260 h70 a20 20 0 0 1 20 20 v30 a20 20 0 0 1 -20 20 h-70 z" fill="#ffffff" stroke="#c0392b" stroke-width="4"/>
    <rect x="550" y="272" width="42" height="30" rx="4" fill="#f6dcd8"/>

    <line x1="270" y1="222" x2="270" y2="328" stroke="#c0392b" stroke-width="2" opacity="0.35"/>
    <line x1="340" y1="222" x2="340" y2="328" stroke="#c0392b" stroke-width="2" opacity="0.35"/>
    <line x1="410" y1="222" x2="410" y2="328" stroke="#c0392b" stroke-width="2" opacity="0.35"/>
    <line x1="480" y1="222" x2="480" y2="328" stroke="#c0392b" stroke-width="2" opacity="0.35"/>

    <circle cx="300" cy="335" r="28" fill="#3d3830"/>
    <circle cx="300" cy="335" r="11" fill="#f7efec"/>
    <circle cx="570" cy="335" r="28" fill="#3d3830"/>
    <circle cx="570" cy="335" r="11" fill="#f7efec"/>
  </g>
</svg>
