<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Showroom and warehouse stock sync illustration">
  <title>ShowroomStock Testing</title>
  <rect width="800" height="450" fill="#f4f1ec"/>
  <circle cx="650" cy="90" r="140" fill="#16a085" opacity="0.08"/>
  <circle cx="110" cy="380" r="120" fill="#16a085" opacity="0.08"/>

  <line x1="60" y1="360" x2="740" y2="360" stroke="#ded7ca" stroke-width="3"/>

  <!-- Warehouse (left) -->
  <g>
    <polygon points="90,200 200,140 310,200" fill="#16a085"/>
    <rect x="90" y="200" width="220" height="160" rx="8" fill="#ffffff" stroke="#16a085" stroke-width="4"/>
    <rect x="128" y="248" width="55" height="62" rx="5" fill="#e7f5f1" stroke="#16a085" stroke-width="2"/>
    <rect x="217" y="248" width="55" height="62" rx="5" fill="#e7f5f1" stroke="#16a085" stroke-width="2"/>
    <rect x="172" y="322" width="56" height="38" rx="4" fill="#16a085"/>
  </g>

  <!-- Showroom (right) -->
  <g>
    <rect x="490" y="180" width="220" height="180" rx="8" fill="#ffffff" stroke="#16a085" stroke-width="4"/>
    <rect x="516" y="216" width="168" height="96" rx="6" fill="#e7f5f1" stroke="#16a085" stroke-width="2"/>
    <rect x="536" y="236" width="48" height="56" rx="4" fill="#16a085" opacity="0.35"/>
    <rect x="600" y="236" width="48" height="56" rx="4" fill="#16a085" opacity="0.35"/>
    <rect x="562" y="330" width="76" height="30" rx="4" fill="#16a085"/>
  </g>

  <!-- Sync arrows between the two buildings -->
  <g stroke="#16a085" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="326" y1="238" x2="472" y2="238"/>
    <polyline points="450,220 474,238 450,256"/>
    <line x1="472" y1="278" x2="326" y2="278"/>
    <polyline points="348,260 324,278 348,296"/>
  </g>

  <!-- Boxes on the ground -->
  <g fill="#16a085">
    <rect x="352" y="326" width="34" height="34" rx="3" opacity="0.9"/>
    <rect x="392" y="312" width="36" height="48" rx="3"/>
    <rect x="420" y="330" width="26" height="30" rx="3" opacity="0.7"/>
  </g>
</svg>
